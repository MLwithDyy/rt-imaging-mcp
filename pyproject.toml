[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rt-imaging-mcp"
version = "0.0.1"
description = "Local, file-based MCP server for medical images and radiotherapy objects with PHI-safe output."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mahdy Firmansyah" }]
keywords = ["mcp", "dicom", "nifti", "radiotherapy", "radiomics", "medical-imaging"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mcp>=2.0,<3",
    "pydicom>=3.0",
    "nibabel>=5.2",
]

[project.scripts]
rt-imaging-mcp = "rt_imaging_mcp.server:main"

[project.urls]
Repository = "https://github.com/MLwithDyy/rt-imaging-mcp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rt_imaging_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["rt_imaging_mcp"]

[[tool.mypy.overrides]]
# nibabel is only partially typed; calls into it are checked by the tests instead.
module = "rt_imaging_mcp.tools.nifti"
disallow_untyped_calls = false
